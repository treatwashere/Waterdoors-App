<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Waterdoors Shop</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: black;
            color: red;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }

        /* The Intro Screen Overlay */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1s ease;
        }

        /* Animated Loading Dots */
        .dots::after {
            content: '';
            animation: loading-dots 1.5s infinite;
        }
        @keyframes loading-dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }

        #status-text {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        /* Red Button with your 0.4 corner */
        #enter-btn {
            display: none; 
            background-color: red;
            color: black;
            border: 2px solid red;
            padding: 15px 45px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            border-radius: 1.0em; /* THE CORNER */
            transition: 0.3s;
        }

        #enter-btn:hover {
            background-color: black;
            color: red;
        }

        /* The Website Frame */
        #site-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            display: none;
        }
    </style>
</head>
<body>

    <audio id="sfx" src="https://github.com/treatwashere/Waterdoors-App/raw/refs/heads/main/duolingo-correct.mp3"></audio>

    <div id="intro-screen">
        <div id="status-text">Loading<span class="dots"></span></div>
        <button id="enter-btn" onclick="fadeAway()">ENTER THE SHOP</button>
    </div>

    <iframe id="site-frame" src=""></iframe>

    <script>
        const intro = document.getElementById('intro-screen');
        const statusText = document.getElementById('status-text');
        const enterBtn = document.getElementById('enter-btn');
        const sfx = document.getElementById('sfx');
        const siteFrame = document.getElementById('site-frame');

        // Logic for the 3-second load
        window.onload = function() {
            setTimeout(() => {
                statusText.innerHTML = "Loaded! Welcome To The Shop!";
                enterBtn.style.display = "block";
            }, 3000);
        };

        // Logic for the Button Click
        function fadeAway() {
            // 1. Play the sound (Works now because of the click!)
            sfx.play().catch(err => console.log("Sound error:", err));

            // 2. Load the site
            siteFrame.src = "https://www.waterdoorsrblx.com";
            siteFrame.style.display = "block";

            // 3. Fade the black screen away
            intro.style.opacity = "0";

            // 4. Remove intro div after 1 second so you can click the site
            setTimeout(() => {
                intro.style.display = "none";
            }, 1000);
        }
    </script>
</body>
</html>
